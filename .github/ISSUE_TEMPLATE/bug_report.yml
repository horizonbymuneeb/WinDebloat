name: Bug report
description: Report a problem with the GUI, CLI, launcher or docs
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please run a **Dry run** first and remove personal data from logs before posting.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where did the problem happen?
      options:
        - GUI
        - CLI
        - Launcher / installation
        - Documentation
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: "Windows 11 24H2 (26100.2033)"
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      placeholder: "5.1.26100.1882"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you click or run? Include the exact CLI command if relevant.
      placeholder: |
        1. Open Debloat-GUI.bat
        2. Select Balanced
        3. Click Dry run
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message or a screenshot if possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste the relevant part of the file in logs/ and redact usernames or personal paths.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I am running the latest release
          required: true
        - label: I ran a Dry run before reporting
          required: false
